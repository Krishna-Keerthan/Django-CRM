{% load static %}
{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django-CRM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    {% tailwind_css %}
</head>
<body>
    {% include "navbar.html" %}
    {% if messages %}
        {% for message in messages %}
            <div id="alertBox" class="flex items-center justify-between p-4 mb-4 text-sm text-blue-800 bg-blue-100 rounded-lg" role="alert">
                {{message}}
            <button type="button" onclick="document.getElementById('alertBox').style.display='none'" class="ml-2 text-blue-800 hover:text-blue-900">
            ✖
            </button>
            </div>

        {% endfor %}
    {% endif %}
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
